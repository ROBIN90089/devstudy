services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devstudy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: devstudy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - study-data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devstudy"]
      interval: 5s
      retries: 5
volumes:
  study-data:
